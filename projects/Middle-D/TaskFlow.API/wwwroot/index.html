<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskFlow — SignalR test</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 760px;
            margin: 24px auto;
            padding: 0 16px;
            background: #0f1115;
            color: #e6e8eb;
        }

        h1 {
            font-size: 20px;
        }

        fieldset {
            border: 1px solid #2a2f3a;
            border-radius: 8px;
            margin-bottom: 16px;
            padding: 12px 16px;
        }

        legend {
            color: #8b93a1;
            font-size: 13px;
            padding: 0 6px;
        }

        input, button {
            font: inherit;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #2a2f3a;
            background: #171a21;
            color: #e6e8eb;
        }

        button {
            cursor: pointer;
            background: #2563eb;
            border-color: #2563eb;
        }

            button:disabled {
                opacity: .45;
                cursor: not-allowed;
            }

        #log {
            background: #0b0d11;
            border: 1px solid #2a2f3a;
            border-radius: 8px;
            padding: 12px;
            height: 340px;
            overflow-y: auto;
            font-family: ui-monospace, monospace;
            font-size: 12.5px;
        }

        .ev {
            color: #4ade80;
        }

        .err {
            color: #f87171;
        }

        .info {
            color: #8b93a1;
        }

        .t {
            color: #52586a;
        }
    </style>
</head>
<body>

    <h1>TaskFlow — SignalR test</h1>

    <fieldset>
        <legend>1 — Kirish</legend>
        <input id="email" type="email" placeholder="email" size="24">
        <input id="password" type="password" placeholder="parol" size="18">
        <button id="loginBtn">Login</button>
    </fieldset>

    <fieldset>
        <legend>2 — Ulanish</legend>
        <button id="connectBtn" disabled>Hub ga ulanish</button>
        <input id="boardId" type="number" placeholder="board id" size="8" value="1">
        <button id="joinBtn" disabled>Board ga qo'shilish</button>
    </fieldset>

    <fieldset>
        <legend>Hodisalar</legend>
        <div id="log"></div>
    </fieldset>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script>
let token = null;
let connection = null;

const $ = id => document.getElementById(id);

function log(msg, cls = 'info') {
  const time = new Date().toLocaleTimeString('uz-UZ');
  const line = document.createElement('div');
  line.innerHTML = `<span class="t">${time}</span> <span class="${cls}">${msg}</span>`;
  $('log').appendChild(line);
  $('log').scrollTop = $('log').scrollHeight;
}

$('loginBtn').onclick = async () => {
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: $('email').value,
        password: $('password').value
      })
    });

    if (!res.ok) {
      log(`Login muvaffaqiyatsiz: ${res.status}`, 'err');
      return;
    }

    const data = await res.json();
    token = data.accessToken;
    log('Token olindi', 'ev');
    $('connectBtn').disabled = false;
  } catch (e) {
    log('Xatolik: ' + e.message, 'err');
  }
};

$('connectBtn').onclick = async () => {
  connection = new signalR.HubConnectionBuilder()
    .withUrl('/hubs/tasks', { accessTokenFactory: () => token })
    .withAutomaticReconnect()
    .build();

  // Serverdagi SendAsync("...") nomlari bilan bir xil bo'lishi kerak
  connection.on('CardCreated',       d => log('CardCreated → '       + JSON.stringify(d), 'ev'));
  connection.on('CardStatusUpdated', d => log('CardStatusUpdated → ' + JSON.stringify(d), 'ev'));
  connection.on('CardDeleted',       d => log('CardDeleted → '       + JSON.stringify(d), 'ev'));
  connection.on('CommentCreated',    d => log('CommentCreated → '    + JSON.stringify(d), 'ev'));
  connection.on('CommentDeleted',    d => log('CommentDeleted → '    + JSON.stringify(d), 'ev'));

  connection.onreconnecting(() => log('Qayta ulanmoqda...', 'err'));
  connection.onreconnected(()  => log('Qayta ulandi', 'ev'));
  connection.onclose(()        => log('Ulanish yopildi', 'err'));

  try {
    await connection.start();
    log('Hub ga ulandi', 'ev');
    $('joinBtn').disabled = false;
    $('connectBtn').disabled = true;
  } catch (e) {
    log('Ulanmadi: ' + e.message, 'err');
  }
};

$('joinBtn').onclick = async () => {
  const id = $('boardId').value;
  try {
    await connection.invoke('JoinBoard', id);
    log(`board-${id} guruhiga qo'shildi`, 'ev');
  } catch (e) {
    log('Xatolik: ' + e.message, 'err');
  }
};
    </script>

</body>
</html>
